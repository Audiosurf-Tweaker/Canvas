# Packages the repository as Canvas.sky and attaches it to the release for the pushed tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest and its files
        run: |
          set -euo pipefail
          test -f Config.json
          test -f shaders/canvas.hlsl
          test -f shaders/clouds.vs.hlsl
          test -f shaders/clouds.ps.hlsl
          test -f scripts/clouds.lua
          test -f textures/noise_p8_n128.dds

      - name: Pack Canvas.sky
        run: zip -r "$RUNNER_TEMP/Canvas.sky" . -x '.git*' -x '.github/*'

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Canvas.sky" --title "$GITHUB_REF_NAME" --generate-notes
